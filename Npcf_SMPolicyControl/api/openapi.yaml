    ApplicationDescriptor:
      description: string with format 'bytes' as defined in OpenAPI
      format: byte
      type: string
    UePolicyContainer:
      description: string with format 'bytes' as defined in OpenAPI
      format: byte
      type: string
    UrspEnforcementInfo:
      description: string with format 'bytes' as defined in OpenAPI
      format: byte
      type: string
    FlowDirection:
      description: |
        Indicates the direction of the service data flow.
        Possible values are:
        - DOWNLINK: The corresponding filter applies for traffic to the UE.
        - UPLINK: The corresponding filter applies for traffic from the UE.
        - BIDIRECTIONAL: The corresponding filter applies for traffic both to and from the UE.
        - UNSPECIFIED: The corresponding filter applies for traffic to the UE (downlink), but has no
        specific direction declared. The service data flow detection shall apply the filter for
        uplink traffic as if the filter was bidirectional. The PCF shall not use the value
        UNSPECIFIED in filters created by the network in NW-initiated procedures. The PCF shall only
        include the value UNSPECIFIED in filters in UE-initiated procedures if the same value is
        received from the SMF.
      enum:
        - DOWNLINK
        - UPLINK
        - BIDIRECTIONAL
        - UNSPECIFIED
      type: string
    FlowDirectionRm:
      description: |
        This data type is defined in the same way as the "FlowDirection" data type, with the only difference that it allows null value.
      enum:
        - DOWNLINK
        - UPLINK
        - BIDIRECTIONAL
        - UNSPECIFIED
        - null
      type: string
      x-enum-descriptions:
        - ""
        - ""
        - ""
        - ""
        - JSON's null value.
    ReportingLevel:
      description: |
        Indicates the reporting level.
        Possible values are:
        - SER_ID_LEVEL: Indicates that the usage shall be reported on service id and rating group
        combination level.
        - RAT_GR_LEVEL: Indicates that the usage shall be reported on rating group level.
        - SPON_CON_LEVEL: Indicates that the usage shall be reported on sponsor identity and rating
        group combination level.
      enum:
        - SER_ID_LEVEL
        - RAT_GR_LEVEL
        - SPON_CON_LEVEL
      nullable: true
      type: string
    MeteringMethod:
      description: |
        Indicates the metering method.
        Possible values are:
        - DURATION: Indicates that the duration of the service data flow traffic shall be metered.
        - VOLUME: Indicates that volume of the service data flow traffic shall be metered.
        - DURATION_VOLUME: Indicates that the duration and the volume of the service data flow
        traffic shall be metered.
        - EVENT: Indicates that events of the service data flow traffic shall be metered.
      enum:
        - DURATION
        - VOLUME
        - DURATION_VOLUME
        - EVENT
      nullable: true
      type: string
    PolicyControlRequestTrigger:
      description: |
        Indicates the policy control request trigger(s).
        Possible values are:
        - PLMN_CH: PLMN Change
        - RES_MO_RE: A request for resource modification has been received by the SMF. The SMF
        always reports to the PCF.
        - AC_TY_CH: Access Type Change.
        - UE_IP_CH: UE IP address change. The SMF always reports to the PCF.
        - UE_MAC_CH: A new UE MAC address is detected or a used UE MAC address is inactive for a
        specific period.
        - AN_CH_COR: Access Network Charging Correlation Information
        - US_RE: The PDU Session or the Monitoring key specific resources consumed by a UE either
        reached the threshold or needs to be reported for other reasons.
        - APP_STA: The start of application traffic has been detected.
        - APP_STO: The stop of application traffic has been detected.
        - AN_INFO: Access Network Information report.
        - CM_SES_FAIL: Credit management session failure.
        - PS_DA_OFF: The SMF reports when the 3GPP PS Data Off status changes. The SMF always
        reports to the PCF.
        - DEF_QOS_CH: Default QoS Change. The SMF always reports to the PCF.
        - SE_AMBR_CH: Session-AMBR Change. The SMF always reports to the PCF.
        - QOS_NOTIF: The SMF notify the PCF when receiving notification from RAN that QoS targets of
        the QoS Flow cannot be guranteed or gurateed again.
        - NO_CREDIT: Out of credit.
        - REALLO_OF_CREDIT: Reallocation of credit.
        - PRA_CH: Change of UE presence in Presence Reporting Area.
        - SAREA_CH: Location Change with respect to the Serving Area.
        - SCNN_CH: Location Change with respect to the Serving CN node.
        - RE_TIMEOUT: Indicates the SMF generated the request because there has been a PCC
        revalidation timeout.
        - RES_RELEASE: Indicate that the SMF can inform the PCF of the outcome of the release of
        resources for those rules that require so.
        - SUCC_RES_ALLO: Indicates that the requested rule data is the successful resource
        allocation.
        - RAI_CH: Location Change with respect to the RAI of GERAN and UTRAN.
        - RAT_TY_CH: RAT Type Change.
        - REF_QOS_IND_CH: Reflective QoS indication Change
        - NUM_OF_PACKET_FILTER: Indicates that the SMF shall report the number of supported packet
        filter for signalled QoS rules.
        - UE_STATUS_RESUME: Indicates that the UE's status is resumed.
        - UE_TZ_CH: UE Time Zone Change.
        - AUTH_PROF_CH: The DN-AAA authorization profile index has changed.
        - QOS_MONITORING: Indicate that the SMF notifies the PCF of the QoS Monitoring information.
        - SCELL_CH: Location Change with respect to the Serving Cell.
        - USER_LOCATION_CH: Indicate that user location has been changed, applicable to serving area
        change and serving cell change.
        - EPS_FALLBACK: EPS Fallback report is enabled in the SMF.
        - MA_PDU: UE Indicates that the SMF notifies the PCF of the MA PDU session request.
        - TSN_BRIDGE_INFO: TSC user plane node information available.
        - 5G_RG_JOIN: The 5G-RG has joined to an IP Multicast Group.
        - 5G_RG_LEAVE: The 5G-RG has left an IP Multicast Group.
        - DDN_FAILURE: Event subscription for DDN Failure event received.
        - DDN_DELIVERY_STATUS: Event subscription for DDN Delivery Status received.
        - GROUP_ID_LIST_CHG: UE Internal Group Identifier(s) has changed: the SMF reports that UDM
        provided list of group Ids has changed.
        - DDN_FAILURE_CANCELLATION: The event subscription for DDN Failure event is cancelled.
        - DDN_DELIVERY_STATUS_CANCELLATION: The event subscription for DDD STATUS is cancelled.
        - VPLMN_QOS_CH: Change of the QoS supported in the VPLMN.
        - SUCC_QOS_UPDATE: Indicates that the requested MPS Action is successful.
        - SAT_CATEGORY_CHG: Indicates that the SMF has detected a change between different satellite
        backhaul categories, or between a satellite backhaul and a non-satellite backhaul.
        - PCF_UE_NOTIF_IND: Indicates the SMF has detected the AMF forwarded the PCF for the UE
        indication to receive/stop receiving notifications of SM Policy association
        established/terminated events.
        - NWDAF_DATA_CHG: Indicates that the NWDAF instance IDs used for the PDU session and/or
        associated Analytics IDs used for the PDU session and available in the SMF have changed.
        - UE_POL_CONT_IND: Indicates that a UE policy container is received from the UE
        in EPC over a PDN connection.
        - URSP_ENFORCEMENT_INFO: Indicates a report of URSP rule enforcement information.
        - HR_SBO_IND_CHG: Indicates the HR-SBO support indication has changed.
        - L4S_SUPP: Indicates whether ECN marking for L4S is not available or available again
        in 5GS.
        - NET_SLICE_REPL: Indicates network slice replacement, i.e., a change between the initial
          S-NSSAI of the PDU Session and the Alternative S-NSSAI
        - BAT_OFFSET_INFO: Indicates that the SMF has detected the BAT offset and optionally
        adjusted periodicity.
      enum:
        - PLMN_CH
        - RES_MO_RE
        - AC_TY_CH
        - UE_IP_CH
        - UE_MAC_CH
        - AN_CH_COR
        - US_RE
        - APP_STA
        - APP_STO
        - AN_INFO
        - CM_SES_FAIL
        - PS_DA_OFF
        - DEF_QOS_CH
        - SE_AMBR_CH
        - QOS_NOTIF
        - NO_CREDIT
        - REALLO_OF_CREDIT
        - PRA_CH
        - SAREA_CH
        - SCNN_CH
        - RE_TIMEOUT
        - RES_RELEASE
        - SUCC_RES_ALLO
        - RAI_CH
        - RAT_TY_CH
        - REF_QOS_IND_CH
        - NUM_OF_PACKET_FILTER
        - UE_STATUS_RESUME
        - UE_TZ_CH
        - AUTH_PROF_CH
        - QOS_MONITORING
        - SCELL_CH
        - USER_LOCATION_CH
        - EPS_FALLBACK
        - MA_PDU
        - TSN_BRIDGE_INFO
        - 5G_RG_JOIN
        - 5G_RG_LEAVE
        - DDN_FAILURE
        - DDN_DELIVERY_STATUS
        - GROUP_ID_LIST_CHG
        - DDN_FAILURE_CANCELLATION
        - DDN_DELIVERY_STATUS_CANCELLATION
        - VPLMN_QOS_CH
        - SUCC_QOS_UPDATE
        - SAT_CATEGORY_CHG
        - PCF_UE_NOTIF_IND
        - NWDAF_DATA_CHG
        - UE_POL_CONT_IND
        - URSP_ENFORCEMENT_INFO
        - HR_SBO_IND_CHG
        - L4S_SUPP
        - NET_SLICE_REPL
        - BAT_OFFSET_INFO
      type: string
    RequestedRuleDataType:
      description: |
        Indicates the type of rule data requested by the PCF.
        Possible values are:
        - CH_ID: Indicates that the requested rule data is the charging identifier.
        - MS_TIME_ZONE: Indicates that the requested access network info type is the UE's timezone.
        - USER_LOC_INFO: Indicates that the requested access network info type is the UE's location.
        - RES_RELEASE: Indicates that the requested rule data is the result of the release of
        resource.
        - SUCC_RES_ALLO: Indicates that the requested rule data is the successful resource
        allocation.
        - EPS_FALLBACK: Indicates that the requested rule data is the report of QoS flow rejection
        due to EPS fallback.
      enum:
        - CH_ID
        - MS_TIME_ZONE
        - USER_LOC_INFO
        - RES_RELEASE
        - SUCC_RES_ALLO
        - EPS_FALLBACK
      type: string
    RuleStatus:
      description: |
        Indicates the status of PCC or session rule.
        Possible values are
        - ACTIVE: Indicates that the PCC rule(s) are successfully installed (for those provisioned
        from PCF) or activated (for those pre-defined in SMF), or the session rule(s) are
        successfully installed
        - INACTIVE: Indicates that the PCC rule(s) are removed (for those provisioned from PCF) or
        inactive (for those pre-defined in SMF) or the session rule(s) are removed.
      enum:
        - ACTIVE
        - INACTIVE
      type: string
    FailureCode:
      description: |
        Indicates the reason of the PCC rule failure.
        Possible values are
        - UNK_RULE_ID: Indicates that the pre-provisioned PCC rule could not be successfully
        activated because the PCC rule identifier is unknown to the SMF.
        - RA_GR_ERR: Indicate that the PCC rule could not be successfully installed or enforced
        because the Rating Group specified within the Charging Data policy decision which the PCC
        rule refers to is unknown or, invalid.
        - SER_ID_ERR: Indicate that the PCC rule could not be successfully installed or enforced
        because the Service Identifier specified within the Charging Data policy decision which the
        PCC rule refers to is invalid, unknown, or not applicable to the service being charged.
        - NF_MAL: Indicate that the PCC rule could not be successfully installed (for those
        provisioned from the PCF) or activated (for those pre-defined in SMF) or enforced (for those
        already successfully installed) due to SMF/UPF malfunction.
        - RES_LIM: Indicate that the PCC rule could not be successfully installed (for those
        provisioned from PCF) or activated (for those pre-defined in SMF) or enforced (for those
        already successfully installed) due to a limitation of resources at the SMF/UPF.
        - MAX_NR_QoS_FLOW: Indicate that the PCC rule could not be successfully installed (for those
        provisioned from PCF) or activated (for those pre-defined in SMF) or enforced (for those
        already successfully installed) due to the fact that the maximum number of QoS flows has
        been reached for the PDU session.
        - MISS_FLOW_INFO: Indicate that the PCC rule could not be successfully installed or enforced
        because neither the "flowInfos" attribute nor the "appId" attribute is specified within the
        PccRule data structure by the PCF during the first install request of the PCC rule.
        - RES_ALLO_FAIL: Indicate that the PCC rule could not be successfully installed or
        maintained since the QoS flow establishment/modification failed, or the QoS flow was
        released.
        - UNSUCC_QOS_VAL: indicate that the QoS validation has failed or when Guaranteed Bandwidth >
        Max-Requested-Bandwidth.
        - INCOR_FLOW_INFO: Indicate that the PCC rule could not be successfully installed or
        modified at the SMF because the provided flow information is not supported by the network
         (e.g. the provided IP address(es) or Ipv6 prefix(es) do not correspond to an IP version
        applicable for the PDU session).
        - PS_TO_CS_HAN: Indicate that the PCC rule could not be maintained because of PS to CS
        handover.
        - APP_ID_ERR: Indicate that the rule could not be successfully installed or enforced because
        the Application Identifier is invalid, unknown, or not applicable to the application
        required for detection.
        - NO_QOS_FLOW_BOUND: Indicate that there is no QoS flow which the SMF can bind the PCC
        rule(s) to.
        - FILTER_RES: Indicate that the Flow Information within the "flowInfos" attribute cannot be
        handled by the SMF because any of the restrictions defined in clause 5.4.2 of 3GPP TS 29.212
        was not met.
        - MISS_REDI_SER_ADDR: Indicate that the PCC rule could not be successfully installed or
        enforced at the SMF because there is no valid Redirect Server Address within the Traffic
        Control Data policy decision which the PCC rule refers to provided by the PCF and no
        preconfigured redirection address for this PCC rule at the SMF.
        - CM_END_USER_SER_DENIED: Indicate that the charging system denied the service request due
        to service restrictions (e.g. terminate rating group) or limitations related to the
        end-user, for example the end-user's account could not cover the requested service.
        - CM_CREDIT_CON_NOT_APP: Indicate that the charging system determined that the service can
        be granted to the end user but no further credit control is needed for the service (e.g.
        service is free of charge or is treated for offline charging).
          - CM_AUTH_REJ: Indicate that the charging system denied the service request in order to
        terminate the service for which credit is requested.
        - CM_USER_UNK: Indicate that the specified end user could not be found in the charging
        system.
        - CM_RAT_FAILED: Indicate that the charging system cannot rate the service request due to
        insufficient rating input, incorrect AVP combination or due to an attribute or an attribute
        value that is not recognized or supported in the rating.
        - UE_STA_SUSP: Indicates that the UE is in suspend state.
        - UNKNOWN_REF_ID: Indicates that the PCC rule could not be successfully installed/modified
        because the referenced identifier to a Policy Decision Data or to a Condition Data is
        unknown to the SMF.
        - INCORRECT_COND_DATA: Indicates that the PCC rule could not be successfully
        installed/modified because the referenced Condition data are incorrect.
        - REF_ID_COLLISION: Indicates that PCC rule could not be successfully installed/modified
        because the same Policy Decision is referenced by a session rule (e.g. the session rule and         the PCC rule refer to the same Usage Monitoring decision data).
        - TRAFFIC_STEERING_ERROR: Indicates that enforcement of the steering of traffic to the
        N6-LAN or 5G-LAN failed; or the dynamic PCC rule could not be successfully installed or
        modified at the NF service consumer because there are invalid traffic steering policy
        identifier(s) within the provided Traffic Control Data policy decision to which the PCC
        rule refers.
        - DNAI_STEERING_ERROR: Indicates that the enforcement of the steering of traffic to the
        indicated DNAI failed; or the dynamic PCC rule could not be successfully installed or
        modified at the NF service consumer because there is invalid route information for a DNAI(s)
         (e.g. routing profile id is not configured) within the provided Traffic Control Data policy
        decision to which the PCC rule refers.
        - AN_GW_FAILED: This value is used to indicate that the AN-Gateway has failed and that the
        PCF should refrain from sending policy decisions to the SMF until it is informed that the
        S-GW has been recovered. This value shall not be used if the SM Policy association
        modification procedure is initiated for PCC rule removal only.
        - MAX_NR_PACKET_FILTERS_EXCEEDED: This value is used to indicate that the PCC rule could not
        be successfully installed, modified or enforced at the NF service consumer because the
        number of supported packet filters for signalled QoS rules for the PDU session has been
        reached.
        - PACKET_FILTER_TFT_ALLOCATION_EXCEEDED: This value is used to indicate that the PCC rule is
        removed at 5GS to EPS mobility because TFT allocation was not possible since the number of
        active packet filters in the EPC bearer is exceeded.
        - MUTE_CHG_NOT_ALLOWED: Indicates that the PCC rule could not be successfully modified
        because the mute condition for application detection report cannot be changed. Applicable
        when the functionality introduced with the ADC feature applies.
      enum:
        - UNK_RULE_ID
        - RA_GR_ERR
        - SER_ID_ERR
        - NF_MAL
        - RES_LIM
        - MAX_NR_QoS_FLOW
        - MISS_FLOW_INFO
        - RES_ALLO_FAIL
        - UNSUCC_QOS_VAL
        - INCOR_FLOW_INFO
        - PS_TO_CS_HAN
        - APP_ID_ERR
        - NO_QOS_FLOW_BOUND
        - FILTER_RES
        - MISS_REDI_SER_ADDR
        - CM_END_USER_SER_DENIED
        - CM_CREDIT_CON_NOT_APP
        - CM_AUTH_REJ
        - CM_USER_UNK
        - CM_RAT_FAILED
        - UE_STA_SUSP
        - UNKNOWN_REF_ID
        - INCORRECT_COND_DATA
        - REF_ID_COLLISION
        - TRAFFIC_STEERING_ERROR
        - DNAI_STEERING_ERROR
        - AN_GW_FAILE
        - MAX_NR_PACKET_FILTERS_EXCEEDED
        - PACKET_FILTER_TFT_ALLOCATION_EXCEEDED
        - MUTE_CHG_NOT_ALLOWED
        - UE_TEMPORARILY_UNAVAILABLE
      type: string
    AfSigProtocol:
      description: |
        Indicates the protocol used for signalling between the UE and the AF.
        Possible values are
        - NO_INFORMATION: Indicate that no information about the AF signalling protocol is being
        provided.
        - SIP: Indicate that the signalling protocol is Session Initiation Protocol.
      enum:
        - NO_INFORMATION
        - SIP
      nullable: true
      type: string
    RuleOperation:
      description: |
        Indicates a UE initiated resource operation that causes a request for PCC rules.
        Possible values are
        - CREATE_PCC_RULE: Indicates to create a new PCC rule to reserve the resource requested by
        the UE.
        - DELETE_PCC_RULE: Indicates to delete a PCC rule corresponding to reserve the resource
        requested by the UE.
        - MODIFY_PCC_RULE_AND_ADD_PACKET_FILTERS: Indicates to modify the PCC rule by adding new
        packet filter(s).
        - MODIFY_PCC_RULE_AND_REPLACE_PACKET_FILTERS: Indicates to modify the PCC rule by replacing
        the existing packet filter(s).
        - MODIFY_PCC_RULE_AND_DELETE_PACKET_FILTERS: Indicates to modify the PCC rule by deleting
        the existing packet filter(s).
        - MODIFY_PCC_RULE_WITHOUT_MODIFY_PACKET_FILTERS: Indicates to modify the PCC rule by
        modifying the QoS of the PCC rule.
      enum:
        - CREATE_PCC_RULE
        - DELETE_PCC_RULE
        - MODIFY_PCC_RULE_AND_ADD_PACKET_FILTERS
        - MODIFY_PCC_RULE_AND_REPLACE_PACKET_FILTERS
        - MODIFY_PCC_RULE_AND_DELETE_PACKET_FILTERS
        - MODIFY_PCC_RULE_WITHOUT_MODIFY_PACKET_FILTERS
      type: string
    RedirectAddressType:
      description: |
        Indicates the redirect address type.
        Possible values are
        - IPV4_ADDR: Indicates that the address type is in the form of "dotted-decimal" IPv4
        address.
        - IPV6_ADDR: Indicates that the address type is in the form of IPv6 address.
        - URL: Indicates that the address type is in the form of Uniform Resource Locator.
        - SIP_URI: Indicates that the address type is in the form of SIP Uniform Resource
        Identifier.
      enum:
        - IPV4_ADDR
        - IPV6_ADDR
        - URL
        - SIP_URI
      type: string
    QosFlowUsage:
      description: |
        Indicates a QoS flow usage information.
        Possible values are
        - GENERAL: Indicate no specific QoS flow usage information is available.
        - IMS_SIG: Indicate that the QoS flow is used for IMS signalling only.
      enum:
        - GENERAL
        - IMS_SIG
      type: string
    FailureCause:
      description: Indicates the cause of the failure in a Partial Success Report.
      enum:
        - PCC_RULE_EVENT
        - PCC_QOS_FLOW_EVENT
        - RULE_PERMANENT_ERROR
        - RULE_TEMPORARY_ERROR
        - POL_DEC_ERROR
      type: string
    CreditManagementStatus:
      description: Indicates the reason of the credit management session failure.
      enum:
        - END_USER_SER_DENIED
        - CREDIT_CTRL_NOT_APP
        - AUTH_REJECTED
        - USER_UNKNOWN
        - RATING_FAILED
      type: string
    SessionRuleFailureCode:
      description: |
        Indicates the reason of the session rule failure.
        Possible values are
        - NF_MAL: Indicates that the PCC rule could not be successfully installed (for those
        provisioned from the PCF) or activated (for those pre-defined in SMF) or enforced (for those
        already successfully installed) due to SMF/UPF malfunction.
        - RES_LIM: Indicates that the PCC rule could not be successfully installed (for those
        provisioned from PCF) or activated (for those pre-defined in SMF) or enforced (for those
        already successfully installed) due to a limitation of resources at the SMF/UPF.
        - SESSION_RESOURCE_ALLOCATION_FAILURE: Indicates the session rule could not be successfully
        enforced due to failure during the allocation of resources for the PDU session in the UE,
        RAN or AMF.
        - UNSUCC_QOS_VAL: indicates that the QoS validation has failed.
        - INCORRECT_UM: The usage monitoring data of the enforced session rule is not the same for
        all the provisioned session rule(s).
        - UE_STA_SUSP: Indicates that the UE is in suspend state.
        - UNKNOWN_REF_ID: Indicates that the session rule could not be successfully
        installed/modified because the referenced identifier to a Policy Decision Data or to a
        Condition Data is unknown to the SMF.
        - INCORRECT_COND_DATA: Indicates that the session rule could not be successfully
        installed/modified because the referenced Condition data are incorrect.
        - REF_ID_COLLISION: Indicates that the session rule could not be successfully
        installed/modified because the same Policy Decision is referenced by a PCC rule (e.g. the
        session rule and the PCC rule refer to the same Usage Monitoring decision data).
        - AN_GW_FAILED: Indicates that the AN-Gateway has failed and that the PCF should refrain
        from sending policy decisions to the SMF until it is informed that the S-GW has been
        recovered. This value shall not be used if the SM Policy association modification procedure
        is initiated for session rule removal only.
        - DEFAULT_QOS_MODIFICATION_FAILURE: Indicates that the enforcement of the default QoS
        modification failed. The SMF shall use this value to indicate to the PCF that the default
        QoS modification has failed.
        - SESSION_AMBR_MODIFICATION_FAILURE: Indicates that the enforcement of the session-AMBR
        modification failed. The SMF shall use this value to indicate to the PCF that the
        session-AMBR modification has failed.
      enum:
        - NF_MAL
        - RES_LIM
        - SESSION_RESOURCE_ALLOCATION_FAILURE
        - UNSUCC_QOS_VAL
        - INCORRECT_UM
        - UE_STA_SUSP
        - UNKNOWN_REF_ID
        - INCORRECT_COND_DATA
        - REF_ID_COLLISION
        - AN_GW_FAILED
        - DEFAULT_QOS_MODIFICATION_FAILURE
        - SESSION_AMBR_MODIFICATION_FAILURE
      type: string
    SteeringFunctionality:
      description: |
        Indicates functionality to support traffic steering, switching and splitting determined
        by the PCF.
        Possible values are
          - MPTCP: Indicates that PCF authorizes the MPTCP functionality to support traffic
          steering, switching and splitting.
          - ATSSS_LL: Indicates that PCF authorizes the ATSSS-LL functionality to support traffic
          steering, switching and splitting.
      enum:
        - MPTCP
        - MPQUIC
        - ATSSS_LL
      type: string
    SteerModeValue:
      description: Indicates the steering mode value determined by the PCF.
      enum:
        - ACTIVE_STANDBY
        - LOAD_BALANCING
        - SMALLEST_DELAY
        - PRIORITY_BASED
        - REDUNDANT
      type: string
    MulticastAccessControl:
      description: |
        Indicates whether the service data flow, corresponding to the service data flow template, is allowed or not allowed.
      enum:
        - ALLOWED
        - NOT_ALLOWED
      type: string
    RequestedQosMonitoringParameter:
      description: Indicates the requested QoS monitoring parameters to be measured.
      enum:
        - DOWNLINK
        - UPLINK
        - ROUND_TRIP
        - DOWNLINK_DATA_RATE
        - UPLINK_DATA_RATE
        - DOWNLINK_CONGESTION
        - UPLINK_CONGESTION
      type: string
    ReportingFrequency:
      description: Indicates the frequency for the reporting.
      enum:
        - EVENT_TRIGGERED
        - PERIODIC
      type: string
    SgsnAddress:
      anyOf: []
      description: describes the address of the SGSN
      example:
        sgsnIpv4Addr: 198.51.100.1
        sgsnIpv6Addr: 2001:db8:85a3::8a2e:370:7334
      nullable: true
      properties:
        sgsnIpv4Addr:
          $ref: "#/components/schemas/Ipv4Addr"
        sgsnIpv6Addr:
          $ref: "#/components/schemas/Ipv6Addr"
      type: object
    SmPolicyAssociationReleaseCause:
      description: |
        Represents the cause due to which the PCF requests the termination of the SM policy association.
      enum:
        - UNSPECIFIED
        - UE_SUBSCRIPTION
        - INSUFFICIENT_RES
        - VALIDATION_CONDITION_NOT_MET
        - REACTIVATION_REQUESTED
      type: string
    PduSessionRelCause:
      description: Contains the SMF PDU Session release cause.
      enum:
        - PS_TO_CS_HO
        - RULE_ERROR
      type: string
    MaPduIndication:
      description: |
        Contains the MA PDU session indication, i.e., MA PDU Request or MA PDU Network-Upgrade Allowed.
      enum:
        - MA_PDU_REQUEST
        - MA_PDU_NETWORK_UPGRADE_ALLOWED
      type: string
    AtsssCapabilityPcf:
      description: Contains the ATSSS capability supported for the MA PDU Session.
      enum:
        - MPTCP_ATSSS_LL_WITH_ASMODE_UL
        - MPTCP_ATSSS_LL_WITH_EXSDMODE_DL_ASMODE_UL
        - MPTCP_ATSSS_LL_WITH_ASMODE_DLUL
        - ATSSS_LL
        - MPTCP_ATSSS_LL
        - MPQUIC_ATSSS_LL_WITH_ASMODE_UL
        - MPQUIC_ATSSS_LL_WITH_EXSDMODE_DL_ASMODE_UL
        - MPQUIC_ATSSS_LL_WITH_ASMODE_DLUL
        - MPQUIC_ATSSS_LL
        - MPTCP_MPQUIC_ATSSS_LL_WITH_ASMODE_UL
        - MPTCP_MPQUIC_ATSSS_LL_WITH_EXSDMODE_DL_ASMODE_UL
        - MPTCP_MPQUIC_ATSSS_LL_WITH_ASMODE_DLUL
        - MPTCP_MPQUIC_ATSSS_LL
      type: string
    NetLocAccessSupport:
      description: |
        Indicates the access network support of the report of the requested access network
        information.
        Possible values are
        - ANR_NOT_SUPPORTED: Indicates that the access network does not support the report of access
        network information.
        - TZR_NOT_SUPPORTED: Indicates that the access network does not support the report of UE
        time zone.
        - LOC_NOT_SUPPORTED: Indicates that the access network does not support the report of UE
        Location (or PLMN Id).
      enum:
        - ANR_NOT_SUPPORTED
        - TZR_NOT_SUPPORTED
        - LOC_NOT_SUPPORTED
      type: string
    PolicyDecisionFailureCode:
      description: Indicates the type of the failed policy decision and/or condition data.
      enum:
        - TRA_CTRL_DECS_ERR
        - QOS_DECS_ERR
        - CHG_DECS_ERR
        - USA_MON_DECS_ERR
        - QOS_MON_DECS_ERR
        - CON_DATA_ERR
        - POLICY_PARAM_ERR
      type: string
    NotificationControlIndication:
      description: |
        Indicates that the notification of DDD Status is requested and/or that the notification of DDN Failure is requested.
      enum:
        - DDN_FAILURE
        - DDD_STATUS
      type: string
    SteerModeIndicator:
      description: Contains Autonomous load-balance indicator or UE-assistance indicator.
      enum:
        - AUTO_LOAD_BALANCE
        - UE_ASSISTANCE
      type: string
    TrafficParameterMeas:
      description: Indicates the traffic parameters to be measured.
      enum:
        - DL_N6_JITTER
        - DL_PERIOD
        - UL_PERIOD
      type: string
    QosMonitoringParamType:
      description: |
        Indicates the QoS monitoring parameter type.
        Possible values are:
        - PACKET_DELAY: Indicates that the QoS monitoring parameter to be measured is packet delay.
        - CONGESTION: Indicates that the QoS monitoring parameter to be measured is congestion.
        - DATA_RATE: Indicates that the QoS monitoring parameter to be measured is data rate.
      enum:
        - PACKET_DELAY
        - CONGESTION
        - DATA_RATE
      type: string
    TransportMode:
      description: |
        Indicates the Transport Mode when the steering functionality is MPQUIC functionality.
      enum:
        - DATAGRAM_MODE_1
        - DATAGRAM_MODE_2
        - STREAM_MODE
      type: string
    ProblemDetails:
      description: Provides additional information in an error response.
      example:
        type: null
        title: title
        status: 2
        detail: detail
        instance: null
        cause: cause
        invalidParams:
          - param: param
            reason: reason
          - param: param
            reason: reason
        supportedFeatures: null
        accessTokenError:
          error: invalid_request
          error_description: error_description
          error_uri: error_uri
        accessTokenRequest:
          grant_type: client_credentials
          nfInstanceId: null
          nfType: NRF
          targetNfType: null
          scope: scope
          targetNfInstanceId: null
          requesterPlmn:
            mcc: null
            mnc: null
          requesterPlmnList:
            - mcc: null
              mnc: null
            - mcc: null
              mnc: null
          requesterSnssaiList:
            - sst: 180
              sd: sd
            - sst: 180
              sd: sd
          requesterFqdn: null
          requesterSnpnList:
            - mcc: null
              mnc: null
              nid: null
            - mcc: null
              mnc: null
              nid: null
          targetPlmn:
            mcc: null
            mnc: null
          targetSnpn:
            mcc: null
            mnc: null
            nid: null
          targetSnssaiList:
            - sst: 180
              sd: sd
            - sst: 180
              sd: sd
          targetNsiList:
            - targetNsiList
            - targetNsiList
          targetNfSetId: null
          targetNfServiceSetId: null
          hnrfAccessTokenUri: null
          sourceNfInstanceId: null
        nrfId: null
        supportedApiVersions:
          - supportedApiVersions
          - supportedApiVersions
        noProfileMatchInfo:
          reason: REQUESTER_PLMN_NOT_ALLOWED
          queryParamCombinationList:
            - queryParams:
                - name: name
                  value: value
                - name: name
                  value: value
            - queryParams:
                - name: name
                  value: value
                - name: name
                  value: value
      properties:
        type:
          $ref: "#/components/schemas/Uri"
        title:
          type: string
        status:
          type: integer
        detail:
          description: A human-readable explanation specific to this occurrence of the problem.
          type: string
        instance:
          $ref: "#/components/schemas/Uri"
        cause:
          description: |
            A machine-readable application error cause specific to this occurrence of the problem. This IE should be present and provide application-related error information, if available.
          type: string
        invalidParams:
          items:
            $ref: "#/components/schemas/InvalidParam"
          minItems: 1
          type: array
        supportedFeatures:
          $ref: "#/components/schemas/SupportedFeatures"
        accessTokenError:
          $ref: "#/components/schemas/AccessTokenErr"
        accessTokenRequest:
          $ref: "#/components/schemas/AccessTokenReq"
        nrfId:
          $ref: "#/components/schemas/Fqdn"
        supportedApiVersions:
          items:
            type: string
          minItems: 1
          type: array
        noProfileMatchInfo:
          $ref: "#/components/schemas/NoProfileMatchInfo"
      type: object
    Uri:
      description: String providing an URI formatted according to RFC 3986.
      type: string
    InvalidParam:
      description: It contains an invalid parameter and a related description.
      example:
        param: param
        reason: reason
      properties:
        param:
          description: |
            If the invalid parameter is an attribute in a JSON body, this IE shall contain the attribute's name and shall be encoded as a JSON Pointer. If the invalid parameter is an HTTP header, this IE shall be formatted as the concatenation of the string "header " plus the name of such header. If the invalid parameter is a query parameter, this IE shall be formatted as the concatenation of the string "query " plus the name of such query parameter. If the invalid parameter is a variable part in the path of a resource URI, this IE shall contain the name of the variable, including the symbols "{" and "}" used in OpenAPI specification as the notation to represent variable path segments.
          type: string
        reason:
          description: |
            A human-readable reason, e.g. "must be a positive integer". In cases involving failed operations in a PATCH request, the reason string should identify the operation that failed using the operation's array index to assist in correlation of the invalid parameter with the failed operation, e.g." Replacement value invalid for attribute (failed operation index= 4)"
          type: string
      required:
        - param
      type: object
    SupportedFeatures:
      description: |
        A string used to indicate the features supported by an API that is used as defined in clause 6.6 in 3GPP TS 29.500. The string shall contain a bitmask indicating supported features in hexadecimal representation Each character in the string shall take a value of "0" to "9", "a" to "f" or "A" to "F" and shall represent the support of 4 features as described in table 5.2.2-3. The most significant character representing the highest-numbered features shall  appear first in the string, and the character representing features 1 to 4 shall appear last  in the string. The list of features and their numbering (starting with 1) are defined  separately for each API. If the string contains a lower number of characters than there are  defined features for an API, all features that would be represented by characters that are not  present in the string are not supported.
      pattern: "^[A-Fa-f0-9]*$"
      type: string
    Fqdn:
      description: Fully Qualified Domain Name
      maxLength: 253
      minLength: 4
      pattern: "^([0-9A-Za-z]([-0-9A-Za-z]{0,61}[0-9A-Za-z])?\\.)+[A-Za-z]{2,63}\\.?$"
      type: string
    RedirectResponse:
      description: |
        The response shall include a Location header field containing a different URI (pointing to a different URI of an other service instance), or the same URI if a request is redirected to the same target resource via a different SCP.
      example:
        cause: cause
        targetScp: null
        targetSepp: null
      properties:
        cause:
          type: string
        targetScp:
          $ref: "#/components/schemas/Uri"
        targetSepp:
          $ref: "#/components/schemas/Uri"
      type: object
    Gpsi:
      description: |
        String identifying a Gpsi shall contain either an External Id or an MSISDN. It shall be formatted as follows -External Identifier= "extid-'extid', where 'extid' shall be formatted according to clause 19.7.2 of 3GPP TS 23.003 that describes an External Identifier.
      pattern: "^(msisdn-[0-9]{5,15}|extid-[^@]+@[^@]+|.+)$"
      type: string
    Supi:
      description: |
        String identifying a Supi that shall contain either an IMSI, a network specific identifier,
        a Global Cable Identifier (GCI) or a Global Line Identifier (GLI) as specified in clause
        2.2A of 3GPP TS 23.003. It shall be formatted as follows
         - for an IMSI "imsi-<imsi>", where <imsi> shall be formatted according to clause 2.2
           of 3GPP TS 23.003 that describes an IMSI.
         - for a network specific identifier "nai-<nai>, where <nai> shall be formatted
           according to clause 28.7.2 of 3GPP TS 23.003 that describes an NAI.
         - for a GCI "gci-<gci>", where <gci> shall be formatted according to clause 28.15.2
           of 3GPP TS 23.003.
         - for a GLI "gli-<gli>", where <gli> shall be formatted according to clause 28.16.2 of
           3GPP TS 23.003.To enable that the value is used as part of an URI, the string shall
           only contain characters allowed according to the "lower-with-hyphen" naming convention
           defined in 3GPP TS 29.501.
      pattern: "^(imsi-[0-9]{5,15}|nai-.+|gci-.+|gli-.+|.+)$"
      type: string
    GroupId:
      description: |
        String identifying a group of devices network internal globally unique ID which identifies a set of IMSIs, as specified in clause 19.9 of 3GPP TS 23.003.
      pattern: "^[A-Fa-f0-9]{8}-[0-9]{3}-[0-9]{2,3}-([A-Fa-f0-9][A-Fa-f0-9]){1,10}$"
      type: string
    PduSessionId:
      description: |
        Unsigned integer identifying a PDU session, within the range 0 to 255, as specified in clause 11.2.3.1b, bits 1 to 8, of 3GPP TS 24.007. If the PDU Session ID is allocated by the Core Network for UEs not supporting N1 mode, reserved range 64 to 95 is used. PDU Session ID within the reserved range is only visible in the Core Network.
      maximum: 255
      minimum: 0
      type: integer
    PduSessionType:
      description: |
        PduSessionType indicates the type of a PDU session. It shall comply with the provisions defined in table 5.4.3.3-1.
      enum:
        - IPV4
        - IPV6
        - IPV4V6
        - UNSTRUCTURED
        - ETHERNET
      type: string
    Dnn:
      description: |
        String representing a Data Network as defined in clause 9A of 3GPP TS 23.003; it shall contain either a DNN Network Identifier, or a full DNN with both the Network Identifier and Operator Identifier, as specified in 3GPP TS 23.003 clause 9.1.1 and 9.1.2. It shall be coded as string in which the labels are separated by dots (e.g. "Label1.Label2.Label3").
      type: string
    DnnSelectionMode:
      description: |
        DNN Selection Mode. Possible values are
        - VERIFIED
        - UE_DNN_NOT_VERIFIED
        - NW_DNN_NOT_VERIFIED
      enum:
        - VERIFIED
        - UE_DNN_NOT_VERIFIED
        - NW_DNN_NOT_VERIFIED
      type: string
    AccessType:
      description: Indicates whether the access is  via 3GPP or via non-3GPP.
      enum:
        - 3GPP_ACCESS
        - NON_3GPP_ACCESS
      type: string
    RatType:
      description: Indicates the radio access used.
      enum:
        - NR
        - EUTRA
        - WLAN
        - VIRTUAL
        - NBIOT
        - WIRELINE
        - WIRELINE_CABLE
        - WIRELINE_BBF
        - LTE-M
        - NR_U
        - EUTRA_U
        - TRUSTED_N3GA
        - TRUSTED_WLAN
        - UTRA
        - GERA
        - NR_LEO
        - NR_MEO
        - NR_GEO
        - NR_OTHER_SAT
        - NR_REDCAP
        - WB_E_UTRAN_LEO
        - WB_E_UTRAN_MEO
        - WB_E_UTRAN_GEO
        - WB_E_UTRAN_OTHERSAT
        - NB_IOT_LEO
        - NB_IOT_MEO
        - NB_IOT_GEO
        - NB_IOT_OTHERSAT
        - LTE_M_LEO
        - LTE_M_MEO
        - LTE_M_GEO
        - LTE_M_OTHERSAT
        - NR_EREDCAP
      type: string
    PlmnIdNid:
      description: |
        Contains the serving core network operator PLMN ID and, for an SNPN, the NID that together with the PLMN ID identifies the SNPN.
      example:
        mcc: null
        mnc: null
        nid: null
      properties:
        mcc:
          $ref: "#/components/schemas/Mcc"
        mnc:
          $ref: "#/components/schemas/Mnc"
        nid:
          $ref: "#/components/schemas/Nid"
      required:
        - mcc
        - mnc
      type: object
    Mcc:
      description: |
        Mobile Country Code part of the PLMN, comprising 3 digits, as defined in clause 9.3.3.5 of 3GPP TS 38.413.
      pattern: "^\\d{3}$"
      type: string
    Mnc:
      description: |
        Mobile Network Code part of the PLMN, comprising 2 or 3 digits, as defined in clause 9.3.3.5 of 3GPP TS 38.413.
      pattern: "^\\d{2,3}$"
      type: string
    Nid:
      description: |
        This represents the Network Identifier, which together with a PLMN ID is used to identify an SNPN (see 3GPP TS 23.003 and 3GPP TS 23.501 clause 5.30.2.1).
      pattern: "^[A-Fa-f0-9]{11}$"
      type: string
    UserLocation:
